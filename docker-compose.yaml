version: '3.8'

services:
  postgresql:
    image: postgres:17
    container_name: postgresql
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: paymentsystem
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data:Z

  axonserver-1:
    image: docker.axoniq.io/axoniq/axonserver:2026.1.3
    pull_policy: always
    hostname: axonserver-1
    env_file:
      - ./axon-server/.env
    ports:
      - '8024:8024'
      - '8124:8124'
      - '8224:8224'